<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xp.css@0.2.6/dist/XP.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:11px;user-select:none;}

  /* ---------- desktop: a hand-drawn nod to the classic green hill + blue sky (not Microsoft's photo) ---------- */
  /* wallpaper: bliss.jpg from the repo on top; if it's missing, the hand-drawn CSS version underneath shows through */
  #desk{position:fixed;left:0;top:0;right:0;bottom:30px;overflow:hidden;
    background:
      url(bliss.jpg) center / cover no-repeat,
      radial-gradient(18% 7% at 22% 20%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
      radial-gradient(14% 5% at 30% 17%, rgba(255,255,255,.7), rgba(255,255,255,0) 70%),
      radial-gradient(22% 8% at 68% 14%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
      radial-gradient(12% 4% at 80% 24%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      radial-gradient(120% 60% at 38% 108%, #9ad14f 0%, #6fb52f 38%, #4f9722 58%, rgba(79,151,34,0) 58.4%),
      radial-gradient(90% 45% at 88% 110%, #7fbf3d 0%, #5aa327 50%, rgba(90,163,39,0) 50.5%),
      linear-gradient(#1f5fd0 0%, #3d86e6 35%, #87bdf2 62%, #c9e2f8 78%, #d8ecfa 100%);}

  /* desktop icons */
  .icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:14px;}
  .icon{width:76px;text-align:center;color:#fff;text-shadow:1px 1px 2px #000,0 0 3px #000;cursor:default;}
  .icon .img{width:34px;height:34px;margin:0 auto 4px;display:block;}
  .icon span{display:inline-block;padding:1px 3px;line-height:1.25;}
  .icon.sel span{background:#316ac5;text-shadow:none;}
  .icon.sel .img{filter:brightness(.75) sepia(1) hue-rotate(180deg) saturate(3);}

  /* the dialog */
  #dlg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:470px;max-width:94vw;user-select:text;}
  #dlg .title-bar-text{display:flex;align-items:center;gap:5px;}
  #dlg .title-bar-text img{width:14px;height:14px;}
  .window.flash .title-bar{filter:saturate(.25) brightness(1.25);}
  .closed{display:none !important;}

  /* XP notification balloon above the tray */
  #balloon{position:fixed;right:10px;bottom:40px;width:270px;max-width:calc(100vw - 20px);background:#ffffe1;border:1px solid #000;border-radius:8px;
    padding:8px 26px 9px 10px;box-shadow:2px 2px 4px rgba(0,0,0,.35);font:11px Tahoma,Arial,sans-serif;color:#000;z-index:20;}
  #balloon::after{content:'';position:absolute;right:40px;bottom:-12px;border-style:solid;border-width:12px 12px 0 0;border-color:#000 transparent transparent transparent;}
  #balloon::before{content:'';position:absolute;right:41px;bottom:-10px;border-style:solid;border-width:10px 10px 0 0;border-color:#ffffe1 transparent transparent transparent;z-index:1;}
  #balloon .bt{display:flex;align-items:center;gap:6px;font-weight:bold;margin-bottom:5px;} #balloon .bt svg{width:16px;height:16px;flex:none;}
  #balloon p{margin:0;line-height:1.4;}
  #bclose{all:unset;position:absolute;right:6px;top:5px;width:15px;height:15px;line-height:14px;text-align:center;font-size:10px;border:1px solid #9a9a9a;border-radius:3px;cursor:default;color:#333;background:#fff;}
  #bclose:hover{border-color:#c33;color:#c33;}
  .msg{display:flex;gap:12px;align-items:flex-start;padding:4px 2px 0;}
  .msg svg{flex:none;width:34px;height:34px;}
  .msg h1{font-size:13px;margin:0 0 6px;font-weight:bold;}
  .msg p{margin:0 0 7px;line-height:1.45;font-size:11px;}
  .msg code{font-family:Tahoma,Arial,sans-serif;background:#fff;border:1px solid #c5c5c5;padding:0 3px;}
  #details{margin:4px 2px 8px 48px;padding:6px 10px;background:#fff;border:1px solid #7f9db9;max-height:150px;overflow:auto;}
  #details ul{margin:2px 0;padding-left:16px;line-height:1.45;} #details li{margin-bottom:3px;}
  .remember{margin:6px 0 0 48px;}
  .btns{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;}
  .btns button{min-width:86px;}
  #go{font-weight:bold;}
  .again,.fine{margin:8px 0 0 48px;color:#555;font-size:10px;line-height:1.4;}
  .fine{color:#777;border-top:1px solid #d7d4c8;padding-top:6px;}

  /* ---------- taskbar ---------- */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:30px;display:flex;align-items:stretch;
    background:linear-gradient(#3168d5 0%, #4993e6 8%, #2157d7 40%, #2663e0 88%, #1941a5 100%);}
  #start{all:unset;display:flex;align-items:center;gap:5px;padding:0 20px 0 10px;margin-right:8px;color:#fff;font:italic bold 17px "Franklin Gothic Medium",Tahoma,Arial,sans-serif;
    text-shadow:1px 1px 1px #1a4a10;border-radius:0 12px 12px 0;cursor:default;
    background:linear-gradient(#5eac56 0%, #3c9e33 12%, #2f8f25 50%, #3aa031 85%, #2b7a24 100%);box-shadow:inset -2px 0 4px rgba(0,0,0,.25);}
  #start:active{filter:brightness(.85);}
  .flag{width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:1px;transform:skewY(-6deg) rotate(-4deg);}
  .flag i{display:block;border-radius:2px 5px 2px 5px;} .flag i:nth-child(1){background:#f65314;} .flag i:nth-child(2){background:#7cbb00;} .flag i:nth-child(3){background:#00a1f1;} .flag i:nth-child(4){background:#ffbb00;}
  .tasks{flex:1;display:flex;gap:3px;align-items:center;min-width:0;overflow:hidden;}
  .task{all:unset;box-sizing:border-box;height:24px;width:190px;min-width:60px;flex:0 1 190px;padding:0 8px;display:flex;align-items:center;gap:5px;
    color:#fff;font:11px Tahoma,Arial,sans-serif;border-radius:3px;cursor:default;white-space:nowrap;overflow:hidden;
    background:linear-gradient(#3c81f3,#2663e0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 1px 1px 0 rgba(255,255,255,.3);}
  .task.on{background:linear-gradient(#1e4fc0,#1a48b3);box-shadow:inset 1px 1px 2px rgba(0,0,0,.45);}
  .task img,.task svg{width:16px;height:16px;flex:none;}
  .task .t{overflow:hidden;text-overflow:ellipsis;}
  .tray{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;color:#fff;font:11px Tahoma,Arial,sans-serif;
    background:linear-gradient(#0c8dea,#14a0f0 10%,#1290e9 50%,#0f7fd9);border-left:1px solid #0b5fb5;box-shadow:inset 1px 0 1px rgba(255,255,255,.35);}
  .langs a{color:#fff;text-decoration:none;opacity:.75;} .langs a.on{opacity:1;font-weight:bold;text-decoration:underline;}
  #vol{all:unset;cursor:pointer;display:flex;} #vol svg{width:16px;height:16px;}
  #clock{min-width:34px;text-align:center;}

  /* ---------- fake Windows Media Player (behind the modal dialog, so clicking it just dings) ---------- */
  /* two overlapping windows: the one clicked last is in front with an active (blue) title bar */
  #dlg{z-index:3;} #wmpwin{z-index:2;} #dlg.front,#wmpwin.front{z-index:5;}
  .window.back .title-bar{filter:saturate(.35) brightness(1.12);}
  #wmpwin{position:absolute;right:26px;top:34px;width:340px;}
  #wmpwin.min{display:none;}
  #wmpwin .title-bar-text{display:flex;align-items:center;gap:5px;} #wmpwin .title-bar-text svg{width:14px;height:14px;}
  .wmp{background:linear-gradient(#1e3a6e,#0f1f3f);padding:6px;border:1px solid #0a1630;color:#cfe0ff;}
  .wmp-tabs{display:flex;gap:2px;margin-bottom:5px;}
  .wmp-tabs span{flex:1;text-align:center;padding:3px 0;font-size:10px;border-radius:3px 3px 0 0;background:linear-gradient(#3b5d9a,#26437a);color:#dbe7ff;}
  .wmp-tabs span.on{background:linear-gradient(#6f9be0,#3e6bbd);color:#fff;font-weight:bold;}
  .wmp-station{font-size:10px;color:#9fc0f5;margin:0 1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #viz{display:block;width:100%;height:190px;background:#000;border:1px solid #06102a;}
  .wmp-info{display:flex;justify-content:space-between;gap:8px;margin:5px 1px 4px;font-size:10px;white-space:nowrap;}
  .wmp-info span{overflow:hidden;text-overflow:ellipsis;} #wmp-viz{color:#8fb2ec;flex:none;}
  .wmp-seek{height:5px;border-radius:3px;background:#0a1630;border:1px solid #3a5a90;margin:0 2px 6px;overflow:hidden;}
  .wmp-seek div{height:100%;width:0;background:linear-gradient(90deg,#4fb3ff,#b6e3ff);}
  .wmp-seek.live div{width:100%;}
  .wmp-ctl{display:flex;align-items:center;justify-content:center;gap:8px;}
  .wmp-ctl i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9cc2f5,#3d68b5 60%,#233f78);box-shadow:0 1px 2px #000;}
  .wmp-ctl i.big{width:32px;height:32px;background:radial-gradient(circle at 35% 30%,#b8f0a0,#46a82e 60%,#256b17);}
  .wmp-ctl svg{width:11px;height:11px;} .wmp-ctl i.big svg{width:14px;height:14px;}
  .wmp-ctl i{cursor:default;} .wmp-ctl i.off{opacity:.45;}
  .title-bar-controls button.dis{filter:grayscale(1) brightness(1.15);opacity:.55;cursor:default;}
  /* not enough room beside the dialog: WMP opens in the bottom-right corner, overlapping it like real windows */
  @media (max-width:1180px){ #wmpwin{top:auto;bottom:14px;right:14px;} }

  @media (max-width:640px){
    #dlg{top:44%;}
    .task{flex-basis:44px;} .task .t{display:none;}
    #wmpwin{right:auto;left:50%;transform:translateX(-50%);bottom:8px;width:min(340px,94vw);}
    #start{padding-right:12px;font-size:15px;}
  }
</style>
</head>

    dlg_title: 'RetroTube — Aviso', start: 'inicio', i_pc: 'Mi PC', i_bin: 'Papelera de reciclaje',
    title: 'Tu bloqueador de anuncios puede mostrar un aviso',
    w_b: '<p>RetroTube es un proyecto de fans que recrea el YouTube de 2008 usando vídeos reales de YouTube. Usa una <b>dirección gratuita</b> de DuckDNS (<code>puellaefan.duckdns.org</code>).</p>' +
         '<p>Algunos bloqueadores, como <b>AdGuard</b>, bloquean <b>todos</b> los sitios con direcciones de este tipo sin mirar el contenido — porque las direcciones gratuitas a veces las usan estafadores. Si ves <b>"Acceso bloqueado"</b>, es solo por la dirección: pulsa <b>"Continuar de todos modos"</b> o añade una excepción para <code>puellaefan.duckdns.org</code>.</p>',
    a_b: '<ul><li>Muestra búsquedas, canales y comentarios del <b>YouTube real</b>, con aspecto de 2008.</li>' +
         '<li>Los vídeos se reproducen en el <b>reproductor oficial de YouTube</b> — no se descarga ni aloja nada en el sitio, y las visitas cuentan para los creadores.</li>' +
         '<li><b>Sin</b> anuncios, sin inicio de sesión, sin cuentas, sin descargas, sin rastreadores.</li>' +
         '<li>Tus favoritos se guardan <b>solo en tu navegador</b>. Todos los detalles en la página <b>Acerca de</b> del sitio.</li></ul>',
    enter: 'Entrar a RetroTube', details: 'Detalles >>', less: '<< Detalles',
    remember: 'Ir directo a RetroTube la próxima vez',
    again: 'Esto se guarda solo en tu navegador. Para ver este aviso otra vez: <a href="?aviso">puellafan.github.io/retrotube/?aviso</a>',
    foot: 'Proyecto de fans no oficial · no afiliado a YouTube, Google ni Microsoft. Radios de terceros: The Mix Radio, 1.FM, Mix FM São Paulo y emisoras de Zeno.fm.',
    mute: 'Silenciar radio', unmute: 'Reproducir radio',
    w_now: 'Reproduciendo', w_lib: 'Biblioteca', w_radio: 'Radio', w_ready: 'Conectando…', w_tune: 'Sintonizando: %s…', w_skip: 'Emisora fuera del aire — pasando a la siguiente…', w_dead: 'Ninguna emisora respondió. Inténtalo más tarde.', b_title: 'Bienvenido a RetroTube', b_text: 'Haz doble clic en <b>RetroTube</b> para entrar al sitio, o en <b>Windows Media Player</b> para escuchar éxitos de los 2000.', b_text_touch: 'Toca <b>RetroTube</b> para entrar al sitio, o <b>Windows Media Player</b> para escuchar éxitos de los 2000.', w_off: 'Radio silenciada', w_paused: 'En pausa', viz: ['Alquimia : Aleatorio', 'Barras y ondas : Barras', 'Ambiente : Remolino']
  }
};
function $(id){ return document.getElementById(id); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }

/* ---------- language ---------- */
var L = 'pt', detOpen = false;
function pick(){ var l = (navigator.language || 'pt').slice(0, 2).toLowerCase(); return T[l] ? l : 'en'; }
function apply(l){
  L = l; var d = T[l]; document.documentElement.lang = l;
  [].forEach.call(document.querySelectorAll('[data-t]'), function(el){ el.innerHTML = d[el.getAttribute('data-t')]; });
  [].forEach.call(document.querySelectorAll('.langs a'), function(a){ a.className = a.getAttribute('data-l') === l ? 'on' : ''; });
  $('det').textContent = detOpen ? d.less : d.details;
  document.title = 'RetroTube';
  if(!$('balloon').classList.contains('closed')) balloonText();
  setVolIcon(); tick();
}
[].forEach.call(document.querySelectorAll('.langs a'), function(a){ a.onclick = function(e){ e.preventDefault(); apply(a.getAttribute('data-l')); }; });

/* ---------- the dialog ---------- */
$('det').onclick = function(){ detOpen = !detOpen; $('details').hidden = !detOpen; $('det').textContent = detOpen ? T[L].less : T[L].details; };
$('go').onclick = function(){
  if($('remember').checked) lsSet('rt:entered', '1'); else lsSet('rt:entered', null);
  location.href = SITE;
};

/* ---------- error sound: erro.mp3 / erro.wav from the repo, synthesized ding until one exists ---------- */
var errAudio = null, lastDing = 0, actx = null;
(function load(list){
  if(!list.length) return;
  var a = new Audio(); a.preload = 'auto';
  a.oncanplaythrough = function(){ errAudio = a; a.oncanplaythrough = null; };
  a.onerror = function(){ load(list.slice(1)); };
  a.src = list[0];
})(['erro.mp3', 'erro.wav']);
function synth(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var t0 = actx.currentTime;
    [[880, 0], [660, 0.09]].forEach(function(n){
      var o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0 + n[1]); g.gain.exponentialRampToValueAtTime(0.25, t0 + n[1] + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + 0.35);
      o.connect(g); g.connect(actx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + 0.4);
    });
  } catch(e){}
}
function ding(){
  var now = Date.now(); if(now - lastDing < 180) return; lastDing = now;
  if(errAudio){ var a = errAudio.cloneNode(); a.volume = 0.8; a.play().catch(synth); } else synth();
  /* like XP: the active window's title bar flashes */
  var d = document.querySelector('.window.front:not(.closed):not(.min)'), n = 0; if(!d) return;
  (function blink(){ d.classList.toggle('flash'); if(++n < 6) setTimeout(blink, 70); else d.classList.remove('flash'); })();
}

/* ---------- radio roulette: plays while Windows Media Player is open (opening it is a click, so browsers allow sound) ----------
   np = where the current song title comes from: 'azura' (The Mix Radio's JSON API, polled) or 'zeno' (Zeno.fm live event feed). */
var STATIONS = [
  { name: 'The Mix Radio — Generation 2K', url: 'https://jupiter.themixradio.ca/listen/station15/radio.mp3', np: 'azura', id: 20 },
  { name: 'The Mix Radio — Best Hits 2010s', url: 'https://jupiter.themixradio.ca/listen/station16/radio.mp3', np: 'azura', id: 21 },
  { name: '1.FM — Y2K', url: 'https://strm112.1.fm/hits2000_mobile_mp3' },
  { name: 'Mix FM São Paulo', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/MIXFM_SAOPAULO.mp3' },
  { name: 'The Wild FM 2010s', url: 'https://stream.zeno.fm/ogq0zgko0jhtv', np: 'zeno', id: 'ogq0zgko0jhtv' },
  { name: 'O Bar Rádio', url: 'https://stream.zeno.fm/gxe6ssh6fc9uv', np: 'zeno', id: 'gxe6ssh6fc9uv' },
  { name: "Sadie's Y2K Playlist", url: 'https://stream.zeno.fm/kxp4m1xtxchvv', np: 'zeno', id: 'kxp4m1xtxchvv' }
];
var radio = $('radio'), st = -1, tuning = false, fails = 0, npTimer = null, npES = null, note = '';
radio.removeAttribute('src');
radio.volume = 0.35;
radio.muted = lsGet('rt:radio-mute') === '1';
function station(){ return STATIONS[st]; }
function playRadio(){
  if(st < 0) return tune(Math.floor(Math.random() * STATIONS.length));    // first open: spin the roulette
  if(!radio.getAttribute('src')) radio.src = station().url;
  radio.play().catch(function(){});
  startNowPlaying();
}
function stopRadio(){ radio.pause(); radio.removeAttribute('src'); radio.load(); stopNowPlaying(); }   // drop the live buffer
function tune(i){
  st = (i + STATIONS.length) % STATIONS.length; songText = ''; tuning = true;
  stopNowPlaying(); showSong(); staticBurst();
  radio.src = station().url; radio.play().catch(function(){});
  $('wmp-station').textContent = '📻 ' + station().name + ' (' + (st + 1) + '/' + STATIONS.length + ')';
  startNowPlaying();
}
radio.addEventListener('playing', function(){ tuning = false; fails = 0; note = ''; });
radio.addEventListener('error', function(){
  if(!radio.getAttribute('src')) return;                               // our own stop, not a failure
  if(++fails >= STATIONS.length){ tuning = false; note = T[L].w_dead; return; }
  note = T[L].w_skip; setTimeout(function(){ note = ''; tune(st + 1); }, 900);   // station down: try the next one
});
/* a short burst of radio static while tuning (Web Audio noise; silent if muted) */
function staticBurst(){
  if(radio.muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var n = Math.floor(actx.sampleRate * 0.45), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.7; g.gain.value = 0.09;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
  } catch(e){}
}
function setVolIcon(){
  $('waves').style.display = radio.muted ? 'none' : ''; $('mutex').style.display = radio.muted ? '' : 'none';
  $('vol').title = radio.muted ? T[L].unmute : T[L].mute;
}
$('vol').onclick = function(e){
  e.stopPropagation();
  radio.muted = !radio.muted; lsSet('rt:radio-mute', radio.muted ? '1' : null);
  setVolIcon();
};
/* current song, per station: The Mix Radio's API every 30s, or Zeno's live feed; others just show the station name */
function showSong(){
  var s = st < 0 ? '' : (songText ? '♫ ' + songText : '📻 ' + station().name);
  $('np').textContent = s || 'Windows Media Player';
  $('wmp').title = 'Windows Media Player' + (s ? ' — ' + s : '');
}
function stopNowPlaying(){ clearInterval(npTimer); npTimer = null; if(npES){ npES.close(); npES = null; } }
function startNowPlaying(){
  stopNowPlaying(); showSong();
  var s = station(), mine = st; if(!s || !s.np) return;
  if(s.np === 'azura'){
    var poll = function(){
      fetch('https://jupiter.themixradio.ca/api/nowplaying/' + s.id).then(function(r){ return r.json(); }).then(function(j){
        var x = j && j.now_playing && j.now_playing.song; if(!x || st !== mine) return;
        songText = (x.artist ? x.artist + ' – ' : '') + x.title; showSong();
      }).catch(function(){});
    };
    poll(); npTimer = setInterval(poll, 30000);
  } else if(s.np === 'zeno' && window.EventSource){
    npES = new EventSource('https://api.zeno.fm/mounts/metadata/subscribe/' + s.id);
    npES.onmessage = function(ev){
      try { var t = JSON.parse(ev.data).streamTitle; if(t && st === mine){ songText = t.replace(/\s*[\(\[](official[^\)\]]*|lyrics?[^\)\]]*|audio|video|visualizer|hd|hq|4k)[\)\]]/gi, '').trim(); showSong(); } } catch(e){}
    };
  }
}

/* ---------- windows: opened from desktop icons, focus on click, minimize/restore from the taskbar, close ---------- */
var dlg = $('dlg'), wmpWin = $('wmpwin'), TASK = { dlg: $('t-dlg'), wmpwin: $('wmp') };
function isOpen(w){ return !w.classList.contains('closed'); }
function isShown(w){ return isOpen(w) && !w.classList.contains('min'); }
function focusWin(w){   // w = window to bring to front, or null (none active)
  [dlg, wmpWin].forEach(function(x){
    var f = x === w; x.classList.toggle('front', f); x.classList.toggle('back', !f);
    TASK[x.id].classList.toggle('on', f && isShown(x));
  });
}
function nextShown(except){ return [dlg, wmpWin].filter(function(x){ return x !== except && isShown(x); })[0] || null; }
function openWin(w){
  w.classList.remove('closed', 'min'); TASK[w.id].classList.remove('closed'); focusWin(w); hideBalloon();
  if(w === wmpWin) spin();
}
function minimizeWin(w){ w.classList.add('min'); focusWin(nextShown(w)); }
function closeWin(w){
  w.classList.add('closed'); TASK[w.id].classList.add('closed'); focusWin(nextShown(w));
  if(w === wmpWin) stopRadio();
}
function taskClick(w){
  if(w.classList.contains('min')){ w.classList.remove('min'); focusWin(w); }
  else if(w.classList.contains('front')) minimizeWin(w);
  else focusWin(w);
}

/* WMP transport: play/pause and stop really control the radio */
$('wmp-pp').onclick = function(){
  if(radio.muted){ radio.muted = false; lsSet('rt:radio-mute', null); setVolIcon(); }
  if(!radio.getAttribute('src') || radio.paused) playRadio(); else radio.pause();
};
$('wmp-stop').onclick = function(){ radio.pause(); };
$('wmp-prev').onclick = function(){ fails = 0; tune(st - 1); };
$('wmp-next').onclick = function(){ fails = 0; tune(st + 1); };
/* every time WMP opens: spin the roulette (never the same station twice in a row) */
function spin(){ var i; do { i = Math.floor(Math.random() * STATIONS.length); } while(STATIONS.length > 1 && i === st); fails = 0; tune(i); }

/* desktop icons: click selects, double-click opens (a single tap on touch screens) */
function openIcon(ic){
  var k = ic.getAttribute('data-open');
  if(k === 'rt') openWin(dlg); else if(k === 'wmp') openWin(wmpWin); else ding();   // My Computer / Recycle Bin: "not allowed"
}
[].forEach.call(document.querySelectorAll('.icon'), function(ic){
  ic.addEventListener('dblclick', function(){ openIcon(ic); });
  ic.addEventListener('pointerup', function(e){ if(e.pointerType && e.pointerType !== 'mouse') openIcon(ic); });
});

/* ---------- clicks ---------- */
document.addEventListener('pointerdown', function(e){
  var t = e.target;
  if(t.closest('.tray') || t.closest('#balloon')) return;
  if(t.closest('.dis')) return;                                 // greyed-out title-bar buttons: nothing happens, like XP
  var tb = t.closest('.task'); if(tb){ taskClick(tb === TASK.dlg ? dlg : wmpWin); return; }
  var w = t.closest('.window');
  if(w){
    if(t.closest('[aria-label="Minimize"]')){ minimizeWin(w); return; }
    if(t.closest('[aria-label="Close"]')){ closeWin(w); return; }
    focusWin(w); return;
  }
  if(t.closest('#start')){ ding(); return; }
  var ic = t.closest('.icon');
  [].forEach.call(document.querySelectorAll('.icon.sel'), function(i){ i.classList.remove('sel'); });
  if(ic) ic.classList.add('sel');
}, true);
$('start').addEventListener('click', function(e){ e.preventDefault(); });

/* ---------- XP balloon tip for first-time visitors ---------- */
var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
function balloonText(){ $('btext').innerHTML = coarse ? T[L].b_text_touch : T[L].b_text; }
function hideBalloon(){ $('balloon').classList.add('closed'); }
$('bclose').onclick = hideBalloon;
setTimeout(function(){ if(!isOpen(dlg) && !isOpen(wmpWin)){ balloonText(); $('balloon').classList.remove('closed'); } }, 1200);
focusWin(null);

/* ---------- WMP visualizer ----------
   The stream sends no CORS headers, so the browser won't let us read the actual audio; these presets are
   drawn procedurally and pulse to a steady ~120 BPM "beat" instead. Runs only while the radio is audible. */
var songText = '', vizIdx = 0, cv = $('viz'), cx = cv.getContext('2d'), W = cv.width, H = cv.height;
var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var parts = []; for(var i = 0; i < 90; i++) parts.push({ a: Math.random() * 6.283, r: 10 + Math.random() * 90, s: 0.3 + Math.random() * 1.2, h: Math.random() * 360 });
function beatAt(t){ var p = (t * 2) % 1; return 0.55 + 0.45 * Math.pow(1 - p, 3); }        // 120 BPM kick envelope
var PRESETS = [
  function alchemy(t, b){                                                                       // rotating colour spirals
    cx.fillStyle = 'rgba(0,0,0,0.14)'; cx.fillRect(0, 0, W, H);
    var arms = 6;
    for(var k = 0; k < arms; k++){
      for(var i = 0; i < 70; i++){
        var ang = i * 0.17 + t * 1.25 + k * 6.283 / arms, r = i * 1.45 * (0.75 + 0.45 * b);
        cx.fillStyle = 'hsl(' + ((t * 45 + i * 4 + k * 40) % 360) + ',95%,' + (45 + 15 * b) + '%)';
        cx.beginPath(); cx.arc(W / 2 + Math.cos(ang) * r, H / 2 + Math.sin(ang) * r * 0.82, 0.8 + i * 0.035 * b, 0, 6.283); cx.fill();
      }
    }
  },
  function bars(t, b){                                                                          // fake spectrum + wave
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    var n = 28, bw = W / n;
    for(var i = 0; i < n; i++){
      var v = 0.15 + 0.85 * Math.abs(Math.sin(t * 2.6 + i * 0.62) * Math.sin(t * 1.3 + i * 1.7)) * (1 - i / n * 0.55) * b;
      var h = v * (H - 30), g = cx.createLinearGradient(0, H, 0, H - h);
      g.addColorStop(0, '#1fd11f'); g.addColorStop(0.6, '#f2e21b'); g.addColorStop(1, '#ff3b1f');
      cx.fillStyle = g; cx.fillRect(i * bw + 1, H - h, bw - 2, h);
    }
    cx.strokeStyle = 'rgba(120,200,255,.9)'; cx.lineWidth = 1.5; cx.beginPath();
    for(var x = 0; x <= W; x += 4){ var y = 34 + Math.sin(x * 0.045 + t * 5) * 14 * b + Math.sin(x * 0.11 - t * 3) * 6; if(x) cx.lineTo(x, y); else cx.moveTo(x, y); }
    cx.stroke();
  },
  function ambience(t, b){                                                                      // swirling particles
    cx.fillStyle = 'rgba(0,0,10,0.18)'; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    parts.forEach(function(p){
      p.a += 0.012 * p.s * (0.6 + b); var r = p.r * (0.85 + 0.3 * b);
      var x = W / 2 + Math.cos(p.a) * r * 1.5, y = H / 2 + Math.sin(p.a * 1.3) * r * 0.8;
      cx.fillStyle = 'hsla(' + ((p.h + t * 30) % 360) + ',90%,60%,0.55)';
      cx.beginPath(); cx.arc(x, y, 1.5 + 2.5 * b * p.s, 0, 6.283); cx.fill();
    });
    cx.globalCompositeOperation = 'source-over';
  }
];
setInterval(function(){ vizIdx = (vizIdx + 1) % PRESETS.length; }, 20000);
var lastStatus = '';
function status(txt){ if(txt !== lastStatus){ lastStatus = txt; $('wmp-song').textContent = txt; } }
function frame(ms){
  requestAnimationFrame(frame);
  if(document.hidden || cv.offsetParent === null) return;             // hidden tab or small screen: skip drawing
  var live = !radio.paused && !radio.muted && radio.readyState >= 3;
  $('wmp-seek').className = live ? 'wmp-seek live' : 'wmp-seek';
  $('wmp-play').style.display = live ? 'none' : ''; $('wmp-pause').style.display = live ? '' : 'none';
  $('wmp-viz').textContent = live ? T[L].viz[vizIdx] : '';
  if(!live){
    status(note || (radio.muted ? T[L].w_off : tuning ? T[L].w_tune.replace('%s', station() ? station().name : '') : radio.paused ? T[L].w_paused : T[L].w_ready));
    cx.fillStyle = 'rgba(0,0,0,0.2)'; cx.fillRect(0, 0, W, H);
    return;
  }
  status(songText ? '♫ ' + songText : station() ? station().name : '');
  var t = ms / 1000 * (calm ? 0.3 : 1);
  PRESETS[vizIdx](t, calm ? 0.8 : beatAt(t));
}
requestAnimationFrame(frame);

/* ---------- clock ---------- */
function tick(){ $('clock').textContent = new Date().toLocaleTimeString(L === 'en' ? 'en-US' : L, { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 10000);

apply(pick());
</script>
